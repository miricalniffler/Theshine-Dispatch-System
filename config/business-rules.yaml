# 日常业务规则的唯一配置入口。旧文件“business-rules .yaml”保留为原始资料。
rules_version: "2026-10-31.2"
timezone: "Asia/Bangkok"

templates:
  dispatch:
    # 车队派单不使用统一开头；每张订单直接从 Order Number 开始。
    header: ""
    meet_greet:
      standard_line: "Meet&Greet"
      greeting_sign_line: "Meet with greeting sign {{greeting_sign_name}}"
    body: |
      Order Number: {{platform_order_number}}
      Passenger Name: {{passenger_name}}
      Passenger Phone Number: {{passenger_phone}}
      Flight Number: {{flight_number|default('none')}}
      Pickup time: {{pickup_datetime}} (Asia/Bangkok)
      Pickup address: {{pickup_address}}
      Dropoff address: {{dropoff_address}}
      Vehicle Type: {{platform_vehicle_type}}{{seat_count|prefix(' ')}}
      Luggage Capacity: Children: {{children|default(0)}}; Adults: {{adults|default(0)}}; Luggage: {{luggage|default(0)}}
      {{child_seat_line|omit_if_empty}}
      {{meet_greet_line|omit_if_empty}}
      {{other_notes|omit_if_empty}}
  dispatch_batch_footers:
    "曼谷": "{{order_count}} {{order_unit}} for tomorrow, please kindly check, thank you!"
    "苏梅": "明日{{order_count}}个订单，请查收~"
  iway_return:
    header: "Dear team, Here are the driver and vehicle details for {{service_date_label_en}}:"
    body: |
      Order ID: {{platform_order_number}}
      Pickup Time: {{pickup_datetime}}
      Vehicle Model: {{confirmed_vehicle_model}}
      Driver Name: {{confirmed_driver_name}}
      Driver Phone: {{normalized_driver_phone}}
      License Plate: {{license_plate}}
    footer: "Thank you!"

validation:
  before_dispatch:
    - platform_order_number
    - pickup_date
    - pickup_time
    - pickup_address
    - dropoff_address
    - passenger_name
    - passenger_phone
    - platform_vehicle_type
  before_iway_return:
    - platform_order_number
    - pickup_datetime
    - confirmed_vehicle_model
    - confirmed_driver_name
    - normalized_driver_phone
    - license_plate

transforms:
  luggage:
    # 订单没有特别说明行李数时，按成人和儿童总人数安排。
    default_to_passenger_count_when_unspecified: true
  phone:
    # 电话展示规则。系统只按下列国家区号识别国际号码；新增来源国家时在此补充，界面与派单文本会自动生效。
    display:
      country_calling_codes: ["+1", "+7", "+20", "+27", "+30", "+31", "+32", "+33", "+34", "+36", "+39", "+40", "+41", "+43", "+44", "+45", "+46", "+47", "+48", "+49", "+51", "+52", "+53", "+54", "+55", "+56", "+57", "+58", "+60", "+61", "+62", "+63", "+64", "+65", "+66", "+81", "+82", "+84", "+86", "+90", "+91", "+92", "+93", "+94", "+95", "+98", "+211", "+212", "+213", "+216", "+218", "+220", "+221", "+222", "+223", "+224", "+225", "+226", "+227", "+228", "+229", "+230", "+231", "+232", "+233", "+234", "+235", "+236", "+237", "+238", "+239", "+240", "+241", "+242", "+243", "+244", "+245", "+246", "+248", "+249", "+250", "+251", "+252", "+253", "+254", "+255", "+256", "+257", "+258", "+260", "+261", "+262", "+263", "+264", "+265", "+266", "+267", "+268", "+269", "+290", "+291", "+297", "+298", "+299", "+350", "+351", "+352", "+353", "+354", "+355", "+356", "+357", "+358", "+359", "+370", "+371", "+372", "+373", "+374", "+375", "+376", "+377", "+378", "+380", "+381", "+382", "+383", "+385", "+386", "+387", "+389", "+420", "+421", "+423", "+500", "+501", "+502", "+503", "+504", "+505", "+506", "+507", "+508", "+509", "+590", "+591", "+592", "+593", "+594", "+595", "+596", "+597", "+598", "+599", "+670", "+672", "+673", "+674", "+675", "+676", "+677", "+678", "+679", "+680", "+681", "+682", "+683", "+685", "+686", "+687", "+688", "+689", "+690", "+691", "+692", "+850", "+852", "+853", "+855", "+856", "+880", "+886", "+960", "+961", "+962", "+963", "+964", "+965", "+966", "+967", "+968", "+970", "+971", "+972", "+973", "+974", "+975", "+976", "+977", "+992", "+993", "+994", "+995", "+996", "+998"]
      separator: " "
    thailand:
      country_code: "+66"
      convert_local_leading_zero: true
      local_digit_lengths: [9, 10]
  # 车型目录是“具体型号 → 完整品牌 + 型号”的唯一来源。只有目录中
  # 唯一对应的型号才补品牌；没有目录项或品牌仍有歧义时，系统保留原文。
  vehicle_models:
    - brand: Toyota
      canonical_name: "Toyota HiAce All New V9"
      model_aliases: ["all new v9", "hiace all new v9"]
    - brand: Toyota
      canonical_name: "Toyota HiAce"
      model_aliases: ["hiace", "hi ace"]
    - brand: Toyota
      canonical_name: "Toyota Commuter"
      model_aliases: ["commuter", "commut"]
      aliases: ["commuter toyota", "commut toyota"]
    - brand: Toyota
      canonical_name: "Toyota Ventury"
      model_aliases: ["ventury"]
    - brand: Toyota
      canonical_name: "Toyota Yaris ATIV"
      model_aliases: ["yaris", "yaris ativ"]
    - brand: Toyota
      canonical_name: "Toyota Camry"
      model_aliases: ["camry"]
    - brand: Toyota
      canonical_name: "Toyota Fortuner"
      model_aliases: ["fortuner"]
    - brand: Toyota
      canonical_name: "Toyota Alphard"
      model_aliases: ["alphard"]
    - brand: Toyota
      canonical_name: "Toyota Vellfire"
      model_aliases: ["vellfire"]
    - brand: Honda
      canonical_name: "Honda City"
      model_aliases: ["city"]
    - brand: Honda
      canonical_name: "Honda Civic"
      model_aliases: ["civic"]
    - brand: Honda
      canonical_name: "Honda CR-V"
      model_aliases: ["cr-v", "crv"]
    - brand: Mitsubishi
      brand_aliases: ["mitsubishi motors"]
      canonical_name: "Mitsubishi Xpander"
      model_aliases: ["xpander"]
    - brand: Mitsubishi
      canonical_name: "Mitsubishi Pajero Sport"
      model_aliases: ["pajero", "pajero sport"]
    - brand: Hyundai
      canonical_name: "Hyundai Staria"
      model_aliases: ["staria"]
    - brand: Hyundai
      canonical_name: "Hyundai H-1"
      model_aliases: ["h-1", "h1"]
    - brand: Isuzu
      canonical_name: "Isuzu MU-X"
      model_aliases: ["mu-x", "mux"]
    - brand: Kia
      canonical_name: "Kia Carnival"
      model_aliases: ["carnival"]
    - brand: Nissan
      canonical_name: "Nissan Almera"
      model_aliases: ["almera"]
    - brand: Mercedes-Benz
      brand_aliases: ["mercedes", "mercedes benz", "mercedes-benz"]
      canonical_name: "Mercedes-Benz V-Class"
      model_aliases: ["v-class", "v class"]
    - brand: BYD
      canonical_name: "BYD M6"
      model_aliases: ["m6"]
    - brand: BYD
      canonical_name: "BYD ATTO 3"
      model_aliases: ["atto 3", "atto3"]
  # 历史输入中的拼写修正或车辆大类；具体车型一律由 vehicle_models 处理。
  vehicle_aliases:
    seadan: "Sedan"
    standard: "Standard"
  # 以下只是车辆大类，不能作为 i’way 回传中的具体车型。
  generic_vehicle_labels_not_allowed_for_return: ["Van", "Minibus", "Sedan", "Standard", "Minivan"]

thresholds:
  dispatch_missing_hours_before_pickup: 24
  driver_details_missing_hours_before_pickup: 12

duplicate_detection:
  compare_fields: [passenger_name, pickup_address, dropoff_address, platform_vehicle_type]
  pickup_time_window_minutes: 30
